# Builds every installer and publishes a GitHub release:
#  - automatically, when a push to main changes "version" in package.json to one with no release yet
#    (the release and its tag v<version> are created at that commit; notes list the commits since the last release);
#  - when a version tag (v1.2.3) is pushed; the tag must match package.json and its message becomes the notes;
#  - by hand from the Actions tab, to rebuild an existing tag.
#
# Android: set the repository secret ANDROID_KEYSTORE_B64 (base64 of the signing keystore) so
# new APKs install as updates over existing ones. Without it the APK is skipped, because an APK
# signed with a different key can't update the installed app.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (for example v1.12.0)
        required: true

permissions:
  contents: write

env:
  # Fingerprint of the app's signing certificate (public; used to check every APK before release).
  APP_SIGNER_SHA256: ed4e957c0d6ac3e74909cfd8d9c6fe718a4bafa52b58946faa7e301c96d52f57

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
      - id: v
        name: Work out the version and whether to release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"; echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] || [ -n "$INPUT_TAG" ]; then
            want="${INPUT_TAG:-$GITHUB_REF_NAME}"
            [ "$want" = "$tag" ] || { echo "::error::Tag $want does not match package.json version $version"; exit 1; }
            echo "ref=$want" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.v.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.v.outputs.go == 'true'
        run: npm ci
      - if: steps.v.outputs.go == 'true'
        run: npm test

  android:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.ref }}
      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 is not set, so the APK is skipped (it could not update the installed app)."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KEYSTORE" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/ledger-flower.keystore"
          echo "LF_KEYSTORE=$RUNNER_TEMP/ledger-flower.keystore" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.key.outputs.ok == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.key.outputs.ok == 'true'
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          # Refuse to publish an APK signed with any other key: it could not update the installed app.
          SIGNER=$("$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA-256 digest' | awk '{print $NF}')
          echo "APK signed with $SIGNER"
          [ "$SIGNER" = "$APP_SIGNER_SHA256" ] || { echo "::error::APK is signed with $SIGNER, expected $APP_SIGNER_SHA256. Check the ANDROID_KEYSTORE_B64 secret."; exit 1; }
          mkdir -p ../out && cp app/build/outputs/apk/debug/app-debug.apk "../out/Ledger-Flower-${{ needs.check.outputs.version }}-android.apk"
      - if: steps.key.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  windows:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp "release/Ledger Flower Setup ${{ needs.check.outputs.version }}.exe" "out/Ledger-Flower-${{ needs.check.outputs.version }}-windows-setup.exe"
          cp release/Ledger-Flower-*-windows-portable.exe out/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  mac:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Ad-hoc sign (Apple-silicon Macs won't open an unsigned app)
        run: |
          mkdir out
          for zip in release/*-mac-*.zip; do
            work=$(mktemp -d)
            ditto -x -k "$zip" "$work"
            codesign --force --deep --sign - "$work/Ledger Flower.app"
            codesign --verify --deep --strict "$work/Ledger Flower.app"
            ditto -c -k --keepParent "$work/Ledger Flower.app" "out/$(basename "$zip")"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/*

  publish:
    # Publishes once Windows (and Android, when its key is set) are built; Mac runners can queue for a
    # long time, so the Mac files are added by the add-mac job when they're ready.
    needs: [check, android, windows]
    if: ${{ !cancelled() && needs.check.outputs.go == 'true' && needs.windows.result == 'success' && needs.android.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          REF: ${{ needs.check.outputs.ref }}
        run: |
          git fetch --force --tags origin
          if [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null)" = tag ]; then
            notes=$(git for-each-ref "refs/tags/$TAG" --format='%(contents)' | sed '/^-----BEGIN PGP/,$d')
          else
            prev=$(git describe --tags --abbrev=0 --match 'v*' "$REF^" 2>/dev/null || git describe --tags --abbrev=0 "$REF^" 2>/dev/null || true)
            notes=$(git log --no-merges --format='- %s' ${prev:+"$prev.."}"$REF" | head -40)
          fi
          [ -n "$notes" ] || notes="Ledger Flower ${TAG#v}"
          printf '%s\n\n%s\n' "$notes" "**Web version:** https://lemonspitz.github.io/ledger-flower/" > notes.md
          cat notes.md; ls -la files
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
          else
            gh release create "$TAG" files/* --target "$REF" --title "Ledger Flower ${TAG#v}" --notes-file notes.md
          fi

  add-mac:
    needs: [check, publish, mac]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.mac.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: files
      - name: Add the Mac files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: gh release upload "$TAG" files/* --clobber --repo "$GITHUB_REPOSITORY"
